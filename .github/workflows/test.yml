name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # macOS enforces code signing to build and launch; the runner has no cert or profile. Ad-hoc sign
  # instead, and drop the entitlements file (CODE_SIGN_ENTITLEMENTS=) — its CloudKit and push
  # entitlements would otherwise demand a provisioning profile. The tests don't need them: the
  # -uiTesting harness never touches CloudKit. This only affects the throwaway CI build.
  SIGNING: >-
    CODE_SIGN_IDENTITY=-
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGNING_ALLOWED=YES
    CODE_SIGN_STYLE=Manual
    DEVELOPMENT_TEAM=
    PROVISIONING_PROFILE_SPECIFIER=
    CODE_SIGN_ENTITLEMENTS=

jobs:
  # The only suite needing no FFmpeg: the scheme is host-less and builds just the test bundle.
  unit:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v6

      # SwiftData's @Model and Observation's @Observable macros can fail fingerprint validation on
      # hosted runners; skipping it lets the build resolve the macro implementations.
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cloning the dependencies is cheap; compiling them is not, so the build products are cached
      # too. The key is exact-match — no restore-keys — because objects built against a different
      # dependency graph or toolchain must never be reused. Only Build and SourcePackages are kept:
      # the index store is regenerated each run rather than restored stale.
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/dd-unit/Build
            ${{ runner.temp }}/dd-unit/SourcePackages
          key: derived-unit-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "SubTrack Common Tests" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-unit" \
            -resultBundlePath "TestResults-Unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: TestResults-Unit.xcresult
          if-no-files-found: ignore

  # DocC downgrades a symbol link it can't resolve, a stale `- Parameter` name, or an empty landing
  # page to a warning and still writes the archive; --warnings-as-errors promotes all of them so a
  # doc comment that has drifted from the code fails the build.
  #
  # DocC has no strictness build setting of its own, so that flag rides on OTHER_DOCC_FLAGS, which
  # the project sets on each of its own targets' build configurations. Passing it on the command
  # line here would reach every Swift package in the graph too, and a dependency's DocC warnings
  # are not this project's to fix; scoped to the first-party targets, they stay warnings.
  docs:
    name: Documentation
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v6
      - uses: ./.github/actions/vendored-ffmpeg

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cloning the dependencies is cheap; compiling them is not, so the build products are cached
      # too. The key is exact-match — no restore-keys — because objects built against a different
      # dependency graph or toolchain must never be reused. Only Build and SourcePackages are kept:
      # the index store is regenerated each run rather than restored stale.
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/dd-docs/Build
            ${{ runner.temp }}/dd-docs/SourcePackages
          key: derived-docs-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      # One derived-data directory for all four schemes: both app editions and the CLI build on the
      # framework, so a shared one compiles it once. The archives are throwaway — nothing publishes
      # them, and the exit status is the whole point.
      - name: Build documentation
        run: |
          set -o pipefail
          for scheme in "SubTrack Common" "SubTrack (MAS)" "SubTrack (download)" "subtrack"; do
            echo "::group::Document $scheme"
            xcodebuild docbuild \
              -project SubTrack.xcodeproj \
              -scheme "$scheme" \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$RUNNER_TEMP/dd-docs" \
              CODE_SIGNING_ALLOWED=NO \
              | xcbeautify --renderer github-actions
            echo "::endgroup::"
          done

  # These tests drive the real subtrack binary against the real Vendor/ffmpeg-full build, generating
  # their movie fixtures at run time rather than committing them.
  cli:
    name: CLI Tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v6
      - uses: ./.github/actions/vendored-ffmpeg

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cloning the dependencies is cheap; compiling them is not, so the build products are cached
      # too. The key is exact-match — no restore-keys — because objects built against a different
      # dependency graph or toolchain must never be reused. Only Build and SourcePackages are kept:
      # the index store is regenerated each run rather than restored stale.
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/dd-cli/Build
            ${{ runner.temp }}/dd-cli/SourcePackages
          key: derived-cli-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      - name: Run CLI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "SubTrack CLI Tests" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-cli" \
            -resultBundlePath "TestResults-CLI.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-cli
          path: TestResults-CLI.xcresult
          if-no-files-found: ignore

  ui-download:
    name: UI Tests (download)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v6
      - uses: ./.github/actions/vendored-ffmpeg

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cloning the dependencies is cheap; compiling them is not, so the build products are cached
      # too. The key is exact-match — no restore-keys — because objects built against a different
      # dependency graph or toolchain must never be reused. Only Build and SourcePackages are kept:
      # the index store is regenerated each run rather than restored stale.
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/dd-ui-download/Build
            ${{ runner.temp }}/dd-ui-download/SourcePackages
          key: derived-ui-download-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      # XCUITEST_TIMEOUT_MULTIPLIER stretches XCUITestKit's waits so the slower CI hardware doesn't
      # trip element lookups that pass locally.
      #
      # HelpScreenshotUITests captures the Help book's images and belongs to `fastlane
      # help_screenshots`, not to a test run: it launches the app six times and its output is only
      # meaningful on a developer's 2x display. -skip-testing keeps it out of the run plan entirely.
      # It also asserts its own capture preconditions and skips on a runner's virtual display, so
      # deleting this line costs CI time but never turns the suite red.
      - name: Run UI tests
        env:
          XCUITEST_TIMEOUT_MULTIPLIER: "3"
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "SubTrack (download) UITests" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-ui-download" \
            -resultBundlePath "TestResults-UI-download.xcresult" \
            -skip-testing:SubTrackDownloadUITests/HelpScreenshotUITests \
            ${{ env.SIGNING }} \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ui-download
          path: TestResults-UI-download.xcresult
          if-no-files-found: ignore

  # Deliberately serialized behind ui-download rather than run beside it. Both app targets produce
  # SubTrack.app, so building one while the other's suite is running replaces the bundle mid-run and
  # every subsequent launch fails with "does not have a process ID".
  ui-mas:
    name: UI Tests (MAS)
    needs: ui-download
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v6
      - uses: ./.github/actions/vendored-ffmpeg

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cloning the dependencies is cheap; compiling them is not, so the build products are cached
      # too. The key is exact-match — no restore-keys — because objects built against a different
      # dependency graph or toolchain must never be reused. Only Build and SourcePackages are kept:
      # the index store is regenerated each run rather than restored stale.
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/dd-ui-mas/Build
            ${{ runner.temp }}/dd-ui-mas/SourcePackages
          key: derived-ui-mas-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      - name: Run UI tests
        env:
          XCUITEST_TIMEOUT_MULTIPLIER: "3"
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "SubTrack (MAS) UITests" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-ui-mas" \
            -resultBundlePath "TestResults-UI-MAS.xcresult" \
            ${{ env.SIGNING }} \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ui-mas
          path: TestResults-UI-MAS.xcresult
          if-no-files-found: ignore
