		01F0A1000000000000000003 /* Sandbox Embedded Executables */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(SRCROOT)/SubTrack-MAS/Helpers.entitlements",
			);
			name = "Sandbox Embedded Executables";
			shellPath = /bin/sh;
			shellScript = (
				"# App Store validation rejects a sandboxed app whose embedded executables carry no sandbox",
				"# entitlement of their own (error 90296). Code-Sign-On-Copy signs them with none, so re-sign",
				"# them here, before the app bundle is sealed around them. `inherit` is what confines a helper to",
				"# the parent app's sandbox, and it is only valid alongside `app-sandbox`.",
				"#",
				"# Only the App Store build does this. The downloadable one embeds the same `subtrack` binary but",
				"# lets the user install it to /usr/local/bin, and a tool signed to inherit a sandbox cannot run",
				"# standalone from a shell.",
				"if [ \"${CODE_SIGNING_ALLOWED}\" = \"NO\" ]; then",
				"  echo \"note: code signing disabled; leaving embedded executables unsigned\"",
				"  exit 0",
				"fi",
				"",
				"IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY}}\"",
				"APP=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}\"",
				"",
				"for helper in Helpers/ffmpeg Helpers/ffprobe Resources/subtrack; do",
				"  [ -f \"${APP}/${helper}\" ] || continue",
				"  codesign --force --sign \"${IDENTITY}\" \\",
				"    --entitlements \"${SRCROOT}/SubTrack-MAS/Helpers.entitlements\" \\",
				"    --options runtime \\",
				"    \"${APP}/${helper}\" || exit 1",
				"done",
				"",
			);
		};
